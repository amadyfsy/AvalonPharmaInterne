<div class="error-page-card rounded-4 border-0 shadow p-4 p-md-5 text-center" style="background: var(--card-bg, #fff); border: 1px solid var(--border-color, #e5eef0) !important;">
  <div class="mb-4 opacity-75" style="color: var(--primary-color, #721818);">
    <i class="bi bi-search" style="font-size: 3.5rem;" aria-hidden="true"></i>
  </div>
  <h1 class="h3 fw-semibold mb-2" style="color: var(--primary-color, #721818);">Page introuvable</h1>
  <p class="text-muted mb-4">
    La ressource demandée n’existe pas ou a été déplacée.
  </p>
  <div class="d-flex flex-wrap gap-2 justify-content-center">
    {% if current_user.is_authenticated %}
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4">
      <i class="bi bi-house-door me-1" aria-hidden="true"></i> Tableau de bord
    </a>
    {% else %}
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary px-4">
      <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i> Connexion
    </a>
    {% endif %}
  </div>
</div>
