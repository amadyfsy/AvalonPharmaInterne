services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requis}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-medical_erp}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER requis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD requis}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-medical_erp}?charset=utf8mb4
      FLASK_CONFIG: production
      TALISMAN_FORCE_HTTPS: ${TALISMAN_FORCE_HTTPS:-false}
      PUBLIC_CORS_ORIGINS: ${PUBLIC_CORS_ORIGINS:-https://votre-site.vercel.app}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/instance/uploads
    ports:
      - "${API_PORT:-5050}:5000"

volumes:
  mysql_data:
  uploads_data:
