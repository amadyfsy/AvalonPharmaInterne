name: Deploy PythonAnywhere

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pythonanywhere
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier les secrets GitHub
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: |
          missing=0
          for name in PA_USERNAME PA_PASSWORD PA_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret manquant : $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Configurez les secrets : GitHub → Settings → Secrets → Actions"
            echo "Documentation : deploy/GITHUB_ACTIONS.md"
            exit 1
          fi

      - name: Déployer sur PythonAnywhere (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PA_SSH_HOST || 'ssh.pythonanywhere.com' }}
          username: ${{ secrets.PA_USERNAME }}
          password: ${{ secrets.PA_PASSWORD }}
          command_timeout: 15m
          script: |
            set -euo pipefail

            PROJECT_DIR="$HOME/AvalonPharmaInterne"
            VENV_DIR="$HOME/.virtualenvs/avalon-interne"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            PYTHON_BIN="/usr/bin/python3.10"

            echo "=== Projet : $PROJECT_DIR ==="

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Premier clone…"
              git clone "$REPO_URL" "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -d "$VENV_DIR/bin" ]; then
              echo "Création du virtualenv…"
              mkdir -p "$(dirname "$VENV_DIR")"
              "$PYTHON_BIN" -m venv "$VENV_DIR"
            fi

            # shellcheck disable=SC1090
            source "$VENV_DIR/bin/activate"
            pip install --upgrade pip
            pip install -r requirements.txt

            if [ ! -f .env ]; then
              echo "ERREUR: fichier .env absent sur PythonAnywhere."
              echo "Exécutez une fois : bash deploy/bootstrap_pythonanywhere.sh \$USER"
              echo "Puis éditez .env et relancez le workflow."
              exit 1
            fi

            set -a
            # shellcheck disable=SC1091
            source .env
            set +a

            python - <<'PY'
            from app import create_app
            from app.extensions import db
            import app.models  # noqa: F401

            app = create_app("production")
            with app.app_context():
                db.create_all()
                print("Schéma BDD à jour.")
            PY

            echo "Déploiement fichiers terminé."

      - name: Recharger l'application Web
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
          PA_DOMAIN: ${{ secrets.PA_DOMAIN }}
          PA_API_HOST: ${{ secrets.PA_API_HOST }}
        run: |
          API_HOST="${PA_API_HOST:-www.pythonanywhere.com}"
          DOMAIN="${PA_DOMAIN:-${PA_USERNAME}.pythonanywhere.com}"
          curl -fsS -X POST \
            -H "Authorization: Token ${PA_API_TOKEN}" \
            "https://${API_HOST}/api/v0/user/${PA_USERNAME}/webapps/${DOMAIN}/reload/"
          echo "Application rechargée : https://${DOMAIN}"
